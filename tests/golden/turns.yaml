# --- follow-ups that need history (3) ---
- id: followup-shorter
  message: "can you make that shorter?"
  tags: [follow-up, must-not-route]
  history:
    - {role: user, content: "explain what a lighthouse keeper does"}
    - {role: assistant, content: "A lighthouse keeper tends the lamp, logs the weather and keeps the station in repair."}
  expect: {tools: none, forbid_routes: [coding, self_repair, book], reply: required}
- id: followup-yes-do-it
