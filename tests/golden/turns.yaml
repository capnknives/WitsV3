# --- owner regression cases (29) ---
# Source: the owner's hand tests of the assistant in July 2026; messages are his own words,
# typos included. Checks are code-only substring and count checks. The refusal cases can only
# catch an obvious failure (a reply that names the forbidden ingredients), and a pass does not
# judge reply quality or tone.
- id: owner-sqrt-784123-typo
  message: "what is the suqare root of 784123"
  tags: [owner-regression, arithmetic]
  expect: {tools_any_of: [calculator, math_operations, python_execute], reply_contains_any: ["885.5"]}
- id: owner-sqrt-784123-not-wrong
  message: "what is the square root of 784123, make sure you are not wrong."
  tags: [owner-regression, arithmetic]
  expect: {tools_any_of: [calculator, math_operations, python_execute], reply_contains_any: ["885.5"]}
# sqrt(75231) = 274.2827
- id: owner-sqrt-75231
  message: "what is the square-root of 75231"
  tags: [owner-regression, arithmetic]
  expect: {tools_any_of: [calculator, math_operations, python_execute], reply_contains_any: ["274.28"]}
# sqrt(75321) = 274.4467, which rounds to 274.45, so both spellings are accepted.
- id: owner-sqrt-75321
  message: "what is the square root of 75,321"
  tags: [owner-regression, arithmetic]
  expect: {tools_any_of: [calculator, math_operations, python_execute], reply_contains_any: ["274.44", "274.45"]}
