# --- follow-ups that need history (3) ---
- id: followup-shorter
  message: "can you make that shorter?"
  tags: [follow-up, must-not-route]
  history:
    - {role: user, content: "explain what a lighthouse keeper does"}
    - {role: assistant, content: "A lighthouse keeper tends the lamp, logs the weather and keeps the station in repair."}
  expect: {tools: none, forbid_routes: [coding, self_repair, book], reply: required}
- id: followup-yes-do-it
  message: "yes please do that"
  tags: [follow-up, must-not-route]
  history:
    - {role: user, content: "I need a packing list for a weekend camping trip"}
    - {role: assistant, content: "Want me to group the list by tent gear, food and clothing?"}
  expect: {tools: none, forbid_routes: [coding, self_repair, book], reply: required}
- id: followup-what-about-tomorrow
  message: "and what about tomorrow?"
  tags: [follow-up]
  history:
    - {role: user, content: "what is today's date?"}
    - {role: assistant, content: "Today is a Sunday in late November."}
  expect: {tools: [datetime], forbid_routes: [coding], reply: required}
