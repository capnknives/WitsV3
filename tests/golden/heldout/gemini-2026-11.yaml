# Second stand-in held-out set, November 22, 2026. Messages come from a list the owner generated
# with Gemini; the 23 that fit the tools WITS has are kept, wording unchanged. Cases marked MANUAL
# need a person to read the reply: the checker only covers the tool part. Not the owner-written set.

# 1 idiom trap: plain explanation, no tool.
- id: gem-01
  message: "I'm completely in the dark about how quantum entanglement works—can you shed some light on it?"
  tags: [chat, must-not-route]
  expect: {tools: none, reply: required}
# 2 hypothetical schedule: plain answer, no tool.
- id: gem-02
  message: "If someone says they are 'burning the midnight oil' on a Tuesday, what time are they probably going to bed?"
  tags: [chat, must-not-route]
  expect: {tools: none, reply: required}
# 3 historical weather: explanation, no live lookup.
- id: gem-03
  message: "What was the weather like on the night the Titanic sank, and how did that affect the lookouts?"
  tags: [chat, must-not-route]
  expect: {tools: none, reply: required}
# 4 code, not execution: show the one-liner, run and write nothing.
- id: gem-04
  message: "Write a bash one-liner that finds and deletes all .tmp files in a Linux directory, and explain each flag."
  tags: [coding]
  expect: {forbid_tools: [python_execute, write_file, apply_code_fix, restart_app], reply: required, reply_contains_any: ["find"]}
# 5 contextual mention of "remind me": explain the phrase, store nothing.
- id: gem-05
  message: "Remind me why people say 'set it and forget it'—where did that phrase come from?"
  tags: [chat, must-not-route]
  expect: {forbid_tools: [write_file, python_execute, restart_app], reply: required}
# 6 arithmetic: must compute with code; exact value 48,343,378.881 (the source list's key was wrong).
- id: gem-06
  message: "What is 84,913 * 7,629 divided by 13.4, rounded to three decimal places?"
  tags: [tool]
  expect: {tools_any_of: [python_execute], reply: required, reply_contains_any: ["48,343,378.881", "48343378.881"]}
# 7 calendar arithmetic: must compute with code; 965 days, Saturday.
- id: gem-07
  message: "Exactly how many days are between March 14, 2027, and November 3, 2029, and what day of the week is the end date?"
  tags: [tool]
  expect: {tools_any_of: [python_execute], reply: required, reply_contains_any: ["965"]}
# 8 live data: must search.
